<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Угадай число</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Угадай число от 1 до 100</h1>

        <div class="game-area">
            <p>У вас есть <strong id="attempts-count">10</strong> попыток!</p>

            <input type="number" id="guess" placeholder="Введите число" min="1" max="100">
            <button id="submit-btn">Проверить</button>

            <div id="message-container" class="message"></div>

            <button id="reset-btn" class="reset-btn">Начать заново</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
